[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
pcov.directory = .

; Use Ubuntu's CA bundle for SMTP STARTTLS and other HTTPS connections.
; Keeping peer verification enabled prevents accepting forged certificates.
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
openssl.capath = /etc/ssl/certs
