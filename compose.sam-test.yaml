name: lextrack-sam-test

services:
    laravel.test:
        build:
            context: ./docker/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: "1337"
        image: lextrack-sam-test/php:8.5
        entrypoint: ["bash", "/usr/local/bin/start-container"]
        environment:
            APP_ENV: testing
            APP_KEY: "${SAM_TEST_APP_KEY:?Set SAM_TEST_APP_KEY in .env.sam-test}"
            APP_DEBUG: "false"
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: "3306"
            DB_DATABASE: lextrack_sam_test
            DB_USERNAME: lextrack_test
            DB_PASSWORD: "${SAM_TEST_DB_PASSWORD:?Set SAM_TEST_DB_PASSWORD in .env.sam-test}"
            MYSQL_ATTR_SSL_VERIFY_SERVER_CERT: "false"
            WWWUSER: "1337"
            LARAVEL_SAIL: "1"
            SUPERVISOR_PHP_USER: sail
            PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
            XDEBUG_MODE: "off"
        volumes:
            # The container runs from an isolated writable copy. The host
            # checkout is intentionally not mounted into this service.
            - sam-test-app:/var/www/html:rw
            - ./docker/sam-test:/opt/sam-test:ro
            - sam-test-composer:/home/sail/.composer:rw
        networks:
            - sam-test
        depends_on:
            init-writable:
                condition: service_completed_successfully
            mysql:
                condition: service_healthy

    init-writable:
        build:
            context: ./docker/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: "1337"
        image: lextrack-sam-test/php:8.5
        entrypoint: ["bash", "/opt/sam-test/init-writable.sh"]
        user: root
        volumes:
            # This is the only service that can see the host checkout, and it
            # can only read it while seeding the isolated app volume.
            - .:/opt/sam-source:ro
            - ./docker/sam-test:/opt/sam-test:ro
            - sam-test-app:/var/www/html:rw
            - sam-test-composer:/home/sail/.composer:rw
        networks:
            - sam-test

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: "${SAM_TEST_DB_ROOT_PASSWORD:?Set SAM_TEST_DB_ROOT_PASSWORD in .env.sam-test}"
            MYSQL_DATABASE: lextrack_sam_test
            MYSQL_USER: lextrack_test
            MYSQL_PASSWORD: "${SAM_TEST_DB_PASSWORD:?Set SAM_TEST_DB_PASSWORD in .env.sam-test}"
            MYSQL_ALLOW_EMPTY_PASSWORD: "0"
        volumes:
            - sam-test-mysql:/var/lib/mysql
        networks:
            - sam-test
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    mysqladmin ping -h 127.0.0.1 -u root
                    -p"$${MYSQL_ROOT_PASSWORD}"
            interval: 5s
            timeout: 5s
            retries: 20

networks:
    sam-test:
        name: lextrack-sam-test
        driver: bridge

volumes:
    sam-test-app:
        name: lextrack-sam-test-app
    sam-test-mysql:
        name: lextrack-sam-test-mysql
    sam-test-vendor:
        name: lextrack-sam-test-vendor
    sam-test-storage:
        name: lextrack-sam-test-storage
    sam-test-bootstrap-cache:
        name: lextrack-sam-test-bootstrap-cache
    sam-test-composer:
        name: lextrack-sam-test-composer
